title: HCs blog
subtitle: ''
description: ''
keywords: []
author: Berlin
language: zh-CN
timezone: ''
url: https://csberlin.github.io
theme: next
permalink: :year/:month/:title/
permalink_defaults: pretty
new_post_name: :title.md
default_layout: post
auto_spacing: true
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
fancybox: true
index_generator:
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 20
  yearly: true
  monthly: true
tag_generator:
  per_page: 20
category_generator:
  per_page: 20
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub: ''
sitemap:
  path: sitemap.xml
robots: 
  user_agent: '*'
  allow:
    - /
  disallow:
show_password: false